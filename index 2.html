<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لطيف 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,#ffd6e8,#ffb3d1);font-family:'Cairo',Tahoma,sans-serif;overflow:hidden;position:relative}
.h{position:absolute;bottom:-60px;animation:up linear infinite;opacity:.75;pointer-events:none;user-select:none}
@keyframes up{to{transform:translateY(-120vh) rotate(25deg)}}
#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center}
.card{animation:pop .45s cubic-bezier(.2,1.4,.4,1);display:flex;flex-direction:column;align-items:center;gap:16px;max-width:100%}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
h1{margin:0;font-size:30px;font-weight:800;color:#c2185b;text-shadow:0 2px 0 #fff}
@keyframes bob{50%{top:-8px}}
.cats{position:relative;display:flex;justify-content:center;align-items:flex-end;width:min(90vw,380px)}
.cats img{width:48%;height:auto;position:relative;transform-origin:50% 100%;transition:transform .8s cubic-bezier(.3,1.4,.5,1);animation:bob 2s ease-in-out infinite}
.cats .c2{animation-delay:-1s}
.cats .mk{position:absolute;top:10%;left:50%;font-size:36px;transform:translateX(-50%) scale(0);transition:transform .4s .4s}
.cats.kiss .c1,.cats.peck .c1{transform:translateX(6%) rotate(8deg)}
.cats.kiss .c2,.cats.peck .c2{transform:translateX(-6%) rotate(-8deg)}
.cats.kiss .mk,.cats.peck .mk,.cats.angry .mk{transform:translateX(-50%) scale(1)}
.cats.kiss .mk{animation:pl .7s ease-in-out infinite .8s}
@keyframes pl{50%{margin-top:-6px;font-size:44px}}
.cats.angry{animation:shake .4s infinite}
.cats.angry img{filter:sepia(.5) saturate(2.2)}
.cats.angry .c1{transform:rotate(-7deg) translateX(-4%)}
.cats.angry .c2{transform:rotate(7deg) translateX(4%)}
@keyframes shake{25%{translate:-4px 0}75%{translate:4px 0}}
.btns{display:flex;flex-direction:column;gap:12px;width:min(80vw,300px)}
button{background:#000;color:#fff;border:4px solid #ff69b4;border-radius:999px;padding:12px 20px;font:800 19px 'Cairo',Tahoma,sans-serif;cursor:pointer;transition:transform .15s}
button:active{transform:scale(.94)}
@keyframes fin{from{opacity:0;transform:translateY(20px) scale(.8)}}
@keyframes zin{from{opacity:0;transform:scale(1.8)}}
@keyframes sin{from{opacity:0;transform:translateX(-40px) rotate(-6deg)}}
.ln{margin:0;font-size:20px;font-weight:600;color:#880e4f;animation:fin .6s both}
.sm .cats{width:min(66vw,220px)}
.cue{min-height:100px;font-size:27px;font-weight:800;color:#c2185b;text-shadow:0 2px 0 #fff;padding:0 8px;display:flex;align-items:center;justify-content:center}
.a0{animation:fin .7s}.a1{animation:zin .7s}.a2{animation:sin .7s}
.dance .cats img{animation-duration:.55s}
.bar{width:min(80vw,300px);height:8px;background:#fff;border-radius:9px;overflow:hidden;border:2px solid #ff69b4}
.bar i{display:block;height:100%;width:0;background:#ff1493}
.fl{position:fixed;z-index:5;pointer-events:none;font-size:26px;transition:transform 1.5s ease-out,opacity 1.5s}
</style>
</head>

 q:{m:'h',t:'ممكن سؤال ؟',b:[['اي كول بيب','love'],['لا تكول','a1']]},
 love:{m:'h',t:'تحبيني؟',b:[['اي','kiss'],['لا','a2']]},
 a1:{m:'angry',t:'هيه بكيفج 🤨🤨',b:[['يلا اسأل','love']]},
 a2:{m:'angry',t:T,b:[['اي احبك اشاقه','kiss']]},
 kiss:{m:'kiss',t:'وانه هم احبج محححح 💋',b:[['كمل 💌','letter']]},
 letter:{m:'h',cls:'sm',t:'طيف 💗',l:['انتي أحلى شي صار بحياتي 🌸','ضحكتج تنسيني كل التعب 😊','يوم أشوفج الدنيا تصير أحلى ✨','حبج بقلبي أكبر من كل الكلام 💞','وانه هم احبج 💗'],b:[['كمل 🎁','gift']]},
 gift:{m:'kiss',t:'هديتج هسه ادزلكياها 🎁',b:[['تشغيل ▶','play']]}
};
function go(k){
 if(k==='play'){startPlay();return}
 const s=S[k],app=document.getElementById('app');
 app.innerHTML=`<div class="card ${s.cls||''}"><h1>${s.t}</h1>${bear(s.m)}${(s.l||[]).map((x,i)=>`<p class="ln" style="animation-delay:${.5+i*.9}s">${x}</p>`).join('')}<div class="btns">${s.b.map((x,i)=>`<button data-k="${x[1]}">${x[0]}</button>`).join('')}</div></div>`;
 app.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.k));
}
const CUES=[[0,'اسمعي هالاغنية.. وكلشي بيها إلج 🎶'],[7,'كل نغمة تذكرني بيج 💭'],[15,'عيونج بيت ما أريد أطلع منه 💗'],[23,'وياج الوقت يمشي وأنا ما أحس ⏳'],[31,'ضحكتج أحلى لحن بالدنيا 😊'],[39,'إنتي حظي الحلو.. وأمان قلبي 🌙'],[47,'خليج وياي لآخر العمر ♾️'],[53,'وانه هم احبج طيف 💋']];
function burst(x,y,n){for(let i=0;i<n;i++){const e=document.createElement('span');e.className='fl';e.textContent=['❤️','💗','💖','💕','✨'][i%5];e.style.left=x+'px';e.style.top=y+'px';document.body.appendChild(e);requestAnimationFrame(()=>{e.style.transform=`translate(${(Math.random()-.5)*260}px,${-80-Math.random()*220}px) scale(${.8+Math.random()})`;e.style.opacity=0});setTimeout(()=>e.remove(),1600)}}
function startPlay(){
 const au=document.getElementById('au'),app=document.getElementById('app');let ci=-1;
 app.innerHTML='<div class="card dance"><div id="cue" class="cue"></div>'+bear('h')+'<div class="bar"><i id="pg"></i></div><div class="btns" id="end"></div></div>';
 const cue=document.getElementById('cue'),pg=document.getElementById('pg');
 au.currentTime=0;au.play().catch(()=>{});
 au.ontimeupdate=()=>{pg.style.width=(au.currentTime/(au.duration||57)*100)+'%';let n=-1;CUES.forEach((c,i)=>{if(au.currentTime>=c[0])n=i});
  if(n!==ci&&n>=0){ci=n;const ct=document.querySelector('.cats');if([2,4,6].includes(n)){ct.classList.add('peck');setTimeout(()=>ct.classList.remove('peck'),1500)}if(n===7){ct.classList.add('kiss');burst(innerWidth/2,innerHeight*.4,24)}cue.className='cue';void cue.offsetWidth;cue.className='cue a'+(n%3);cue.textContent=CUES[n][1];burst(innerWidth/2,innerHeight*.75,8)}};
 au.onended=()=>{pg.style.width='100%';document.getElementById('end').innerHTML='<button id="rp">اسمعها مرة ثانية 🔁</button>';document.getElementById('rp').onclick=startPlay;burst(innerWidth/2,innerHeight*.6,16)};
 app.onclick=e=>{if(e.target.tagName!=='BUTTON')burst(e.clientX,e.clientY,5)};
}
go('hi');
</script>
</body>
